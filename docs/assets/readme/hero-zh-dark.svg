    <rect x="688" y="40" width="456" height="78" rx="18" fill="#161A26" stroke="#282E40" stroke-width="1.2"/>
    <circle cx="716" cy="79" r="5.5" fill="#60A5FA"/>
    <text x="736" y="73" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="19.5" font-weight="700" fill="#F3F5F9">轻量多端与聊天渠道</text>
    <text x="736" y="99" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#9AA1B6">macOS 桌面 · Web · 飞书 / Telegram · /v1/* SDK</text>

    <!-- Node 2: Headless Core (Router + Parallel Workers) -->
    <rect x="688" y="141" width="456" height="78" rx="18" fill="#2E1722" stroke="#692942" stroke-width="1.4"/>
    <g transform="translate(705 164) scale(0.32)">
    <rect x="0.75" y="0.75" width="98.5" height="98.5" rx="22.8" fill="url(#hero-zh-dark-brand)" stroke="rgba(255,255,255,0.24)" stroke-width="1.5"/>
    <g transform="translate(13 13) scale(0.74)">
      <path d="M 24 80 C 11 80 7 70 7 56 C 7 35 22 24 50 24 C 78 24 93 35 93 56 C 93 70 89 80 76 80 Z" fill="#FFFFFF"/>
      <circle cx="45" cy="51" r="4.5" fill="#C81742"/>
      <circle cx="65" cy="51" r="4.5" fill="#C81742"/>
