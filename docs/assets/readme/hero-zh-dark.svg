    <text x="750" y="174" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="19.5" font-weight="700" fill="#F3F5F9">Headless 独立服务 · 双层 Agent</text>
    <text x="750" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#C3C9D9">无 Shell 主脑秒回 · 并行 Worker 静默执行</text>

    <!-- Node 3: Code-Enforced Safety & Local Memory -->
    <rect x="688" y="242" width="456" height="78" rx="18" fill="#161A26" stroke="#282E40" stroke-width="1.2"/>
    <circle cx="716" cy="281" r="5.5" fill="#4ADE80"/>
    <text x="736" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="19.5" font-weight="700" fill="#F3F5F9">代码级边界与本地记忆</text>
    <text x="736" y="301" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#9AA1B6">花钱必问 · AES-256-GCM 零弹窗 · SOUL / MEMORY.md</text>
  </g>
</svg>
