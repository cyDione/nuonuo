    <rect width="1200" height="360" fill="url(#hero-zh-dark-g1)"/>
    <rect width="1200" height="360" fill="url(#hero-zh-dark-g2)"/>
  </g>
  <rect x="0.75" y="0.75" width="1198.5" height="358.5" rx="23.25" fill="none" stroke="#252B3B" stroke-width="1.5"/>

  <!-- Left: Calm Editorial Title -->
  <g id="title-block">
    <g transform="translate(56 44) scale(0.52)">
    <rect x="0.75" y="0.75" width="98.5" height="98.5" rx="22.8" fill="url(#hero-zh-dark-brand)" stroke="rgba(255,255,255,0.24)" stroke-width="1.5"/>
    <g transform="translate(13 13) scale(0.74)">
      <path d="M 24 80 C 11 80 7 70 7 56 C 7 35 22 24 50 24 C 78 24 93 35 93 56 C 93 70 89 80 76 80 Z" fill="#FFFFFF"/>
      <circle cx="45" cy="51" r="4.5" fill="#C81742"/>
      <circle cx="65" cy="51" r="4.5" fill="#C81742"/>
    </g></g>
    <rect x="122" y="55" width="260" height="30" rx="15" fill="#161A26" stroke="#262C3D"/>
    <circle cx="139" cy="70" r="4" fill="#FB7185"/>
    <text x="152" y="75.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" font-weight="600" letter-spacing="0.4" fill="#9AA1B6">v0.4 · 自托管个人助理</text>

    <text x="56" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="76" font-weight="800" letter-spacing="0.5" fill="#F3F5F9">糯糯</text>
    <text x="220" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="34" font-weight="500" fill="#6F778E">Nuonuo</text>

    <text x="56" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="600" fill="#F3F5F9">装在自己设备上的主动式个人助理。</text>
    <text x="56" y="268" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="19.5" fill="#C3C9D9">一台独立服务常驻后台，多端安全接入，花钱外发先问你。</text>

    <text x="56" y="318" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="500" fill="#6F778E">NODE 22  ·  SQLITE  ·  MARKDOWN MEMORY  ·  MIT</text>
  </g>

  <!-- Right: Minimal Decoupled Ceramic Stack (No duplicate chat card) -->
  <g id="ceramic-topology">
    <!-- Subtle vertical spine -->
    <line x1="910" y1="86" x2="910" y2="274" stroke="#343C52" stroke-width="1.5" stroke-dasharray="4 4"/>

