<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Nuonuo — Self-Hosted, Decoupled Personal Assistant</title>
  <desc id="desc">A calm, self-hosted personal assistant on your own hardware: one headless /v1 server, thin clients everywhere, parallel background Workers, and code-enforced safety.</desc>
  <defs>
    <linearGradient id="hero-en-dark-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1017"/>
      <stop offset="54%" stop-color="#111520"/>
      <stop offset="100%" stop-color="#0E131F"/>
    </linearGradient>
    <radialGradient id="hero-en-dark-g1" cx="10%" cy="14%" r="54%">
      <stop offset="0%" stop-color="#591D35" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#591D35" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hero-en-dark-g2" cx="92%" cy="88%" r="54%">
      <stop offset="0%" stop-color="#1B3560" stop-opacity="0.36"/>
      <stop offset="100%" stop-color="#1B3560" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hero-en-dark-brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E32450"/>
      <stop offset="100%" stop-color="#B9143C"/>
    </linearGradient>
    <clipPath id="hero-en-dark-clip">
      <rect width="1200" height="360" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#hero-en-dark-clip)">
    <rect width="1200" height="360" fill="url(#hero-en-dark-bg)"/>
    <rect width="1200" height="360" fill="url(#hero-en-dark-g1)"/>
    <rect width="1200" height="360" fill="url(#hero-en-dark-g2)"/>
  </g>
  <rect x="0.75" y="0.75" width="1198.5" height="358.5" rx="23.25" fill="none" stroke="#252B3B" stroke-width="1.5"/>

  <!-- Left: Calm Editorial Title -->
  <g id="title-block">
    <g transform="translate(56 44) scale(0.52)">
    <rect x="0.75" y="0.75" width="98.5" height="98.5" rx="22.8" fill="url(#hero-en-dark-brand)" stroke="rgba(255,255,255,0.24)" stroke-width="1.5"/>
    <g transform="translate(13 13) scale(0.74)">
      <path d="M 24 80 C 11 80 7 70 7 56 C 7 35 22 24 50 24 C 78 24 93 35 93 56 C 93 70 89 80 76 80 Z" fill="#FFFFFF"/>
      <circle cx="45" cy="51" r="4.5" fill="#C81742"/>
      <circle cx="65" cy="51" r="4.5" fill="#C81742"/>
    </g></g>
    <rect x="122" y="55" width="284" height="30" rx="15" fill="#161A26" stroke="#262C3D"/>
    <circle cx="139" cy="70" r="4" fill="#FB7185"/>
    <text x="152" y="75.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" font-weight="600" letter-spacing="0.4" fill="#9AA1B6">v0.4 · SELF-HOSTED AI</text>

    <text x="56" y="174" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="72" font-weight="800" letter-spacing="-1.4" fill="#F3F5F9">Nuonuo</text>
    <text x="334" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="30" font-weight="500" fill="#6F778E">糯糯</text>

    <text x="56" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="21" font-weight="600" fill="#F3F5F9">A calm, self-hosted personal assistant.</text>
    <text x="56" y="268" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="18.5" fill="#C3C9D9">One headless /v1 server, thin apps anywhere, hard-coded safety.</text>

    <text x="56" y="318" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="500" fill="#6F778E">NODE 22  ·  SQLITE  ·  MARKDOWN MEMORY  ·  MIT</text>
  </g>

  <!-- Right: Minimal Decoupled Ceramic Stack (No duplicate chat card) -->
  <g id="ceramic-topology">
    <!-- Subtle vertical spine -->
    <line x1="910" y1="86" x2="910" y2="274" stroke="#343C52" stroke-width="1.5" stroke-dasharray="4 4"/>

    <!-- Node 1: Thin Multi-Device Clients -->
    <rect x="688" y="40" width="456" height="78" rx="18" fill="#161A26" stroke="#282E40" stroke-width="1.2"/>
    <circle cx="716" cy="79" r="5.5" fill="#60A5FA"/>
    <text x="736" y="73" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="19.5" font-weight="700" fill="#F3F5F9">Thin Clients &amp; Channels</text>
    <text x="736" y="99" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#9AA1B6">macOS App · Web · Telegram / Feishu · /v1/* SDK</text>

    <!-- Node 2: Headless Core (Router + Parallel Workers) -->
    <rect x="688" y="141" width="456" height="78" rx="18" fill="#2E1722" stroke="#692942" stroke-width="1.4"/>
    <g transform="translate(705 164) scale(0.32)">
    <rect x="0.75" y="0.75" width="98.5" height="98.5" rx="22.8" fill="url(#hero-en-dark-brand)" stroke="rgba(255,255,255,0.24)" stroke-width="1.5"/>
    <g transform="translate(13 13) scale(0.74)">
      <path d="M 24 80 C 11 80 7 70 7 56 C 7 35 22 24 50 24 C 78 24 93 35 93 56 C 93 70 89 80 76 80 Z" fill="#FFFFFF"/>
      <circle cx="45" cy="51" r="4.5" fill="#C81742"/>
      <circle cx="65" cy="51" r="4.5" fill="#C81742"/>
    </g></g>
    <text x="750" y="174" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="19.5" font-weight="700" fill="#F3F5F9">Headless Server · Router &amp; Workers</text>
    <text x="750" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#C3C9D9">Shell-free Router replies fast · Workers run in parallel</text>

    <!-- Node 3: Code-Enforced Safety & Local Memory -->
    <rect x="688" y="242" width="456" height="78" rx="18" fill="#161A26" stroke="#282E40" stroke-width="1.2"/>
    <circle cx="716" cy="281" r="5.5" fill="#4ADE80"/>
    <text x="736" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="19.5" font-weight="700" fill="#F3F5F9">Code-Enforced Limits &amp; Memory</text>
    <text x="736" y="301" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#9AA1B6">Ask before spend · AES-256-GCM · Local Markdown</text>
  </g>
</svg>
