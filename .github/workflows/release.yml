name: Release

# Builds every release package on its own machine (native modules come from the build machine):
#   Linux headless (service + web UI, own Node.js)   x64, arm64        super-assistant-<v>-linux-<arch>.tar.gz
#   macOS desktop app (own Node.js and service)      arm64, x64        super-assistant-<v>-mac-<arch>.dmg / .zip
#   Windows desktop app (own Node.js and service)    x64, arm64        super-assistant-<v>-win-<arch>-setup.exe / .zip
# On a v* tag the packages are published as the GitHub Release that install.sh and the update check read.
#
# Releasing without anyone clicking: run this workflow by hand (Actions → Release → Run workflow, or the API) with a
# version. It checks every package is already at that version (pnpm set-version, merged first), builds all six
# packages from the chosen commit, and only when every build passed creates the v<version> tag and the Release.
# A tag or Release made with the workflow token starts no other workflow, so the build happens in this same run.
# With rebuild on, the version must already be released: the packages are built again from its tag and uploaded to
# its Release, replacing any that are there (for a release whose build stopped).
# Without a version, a manual run only builds the packages (as on pull requests).

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.2.2 (empty: build only, publish nothing)'
        required: false
        default: ''
      rebuild:
        description: 'Rebuild an existing release from its tag and upload the packages to it'
        type: boolean
        default: false
      notes:
        description: 'Release notes in Markdown (empty: generated from the merged pull requests)'
        required: false
        default: ''
  push:
    tags: ['v*']
  pull_request:
    paths:
      - scripts/stage-daemon.sh
      - scripts/stage-desktop.mjs
      - scripts/package-linux.sh
      - scripts/set-version.mjs
      - install.sh
      - apps/desktop/**
      - .github/workflows/release.yml

permissions:
  contents: read

jobs:
  # Decides what this run releases: the pushed v* tag, the version given to a manual run, or nothing.
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.what.outputs.tag }}
      sha: ${{ steps.what.outputs.sha }}
    steps:
      - id: what
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          REBUILD: ${{ inputs.rebuild }}
        run: |
          tag=""
          sha="$GITHUB_SHA"
          if [ "$GITHUB_REF_TYPE" = tag ] && [[ "$GITHUB_REF_NAME" == v* ]]; then
            tag="$GITHUB_REF_NAME"
          elif [ -n "$VERSION" ]; then
            version="${VERSION#v}"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::not a version: $VERSION"; exit 1; }
            tag="v$version"
            if [ "$REBUILD" = true ]; then
              # Build what the tag points at, not the branch the run was started from.
              sha="$(gh api "repos/$GH_REPO/commits/$tag" --jq .sha)" || { echo "::error::no tag $tag to rebuild"; exit 1; }
              gh release view "$tag" >/dev/null 2>&1 || { echo "::error::no release $tag to rebuild"; exit 1; }
            else
              # Never release a version twice: an existing tag or Release stops the run before anything is built.
              if gh api "repos/$GH_REPO/git/ref/tags/$tag" >/dev/null 2>&1; then echo "::error::tag $tag already exists"; exit 1; fi
              if gh release view "$tag" >/dev/null 2>&1; then echo "::error::release $tag already exists"; exit 1; fi
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "release: ${tag:-none}, commit $sha"

  linux:
    name: linux-${{ matrix.arch }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: x64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Check the tag matches the version
        if: needs.prepare.outputs.tag != ''
        # Every package must be at the tag's version (pnpm set-version sets them all); the update check compares them.
        run: node scripts/set-version.mjs --check "${{ needs.prepare.outputs.tag }}"

      - name: Build web UI and service
        run: pnpm build

      - name: Package
        run: bash scripts/package-linux.sh ${{ matrix.arch }}

      - name: Smoke test the package (background start on all interfaces, stop)
        run: |
          mkdir -p "$RUNNER_TEMP/pkg"
          tar -xzf dist/super-assistant-*-linux-${{ matrix.arch }}.tar.gz -C "$RUNNER_TEMP/pkg"
          bin="$(echo "$RUNNER_TEMP"/pkg/*/bin/super-assistant)"
          export SUPER_ASSISTANT_HOME="$RUNNER_TEMP/home" SUPER_ASSISTANT_SECRETS=file
          "$bin" start -d --host 0.0.0.0 --port 7431
          token="$(cat "$SUPER_ASSISTANT_HOME/token")"
          curl -fsS -H "authorization: Bearer $token" http://127.0.0.1:7431/api/health
          lan="$(hostname -I | awk '{print $1}')"
          curl -fsS -o /dev/null -H "authorization: Bearer $token" "http://$lan:7431/api/health"
          curl -fsS -o /dev/null http://127.0.0.1:7431/
          "$bin" status
          "$bin" stop
          cat "$SUPER_ASSISTANT_HOME/logs/daemon.log"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/super-assistant-*-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  desktop:
    name: ${{ matrix.os }}-${{ matrix.arch }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, os: mac, arch: arm64 }  # macos-14 jobs are cancelled before they start (image retired)
          - { runner: macos-15-intel, os: mac, arch: x64 }
          - { runner: windows-2025, os: win, arch: x64 }
          - { runner: windows-11-arm, os: win, arch: arm64 }
    defaults:
      run:
        shell: bash
    env:
      # No Developer ID: the macOS app is ad-hoc signed (mac.identity "-"), also on pull requests.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      CSC_FOR_PULL_REQUEST: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Check the tag matches the version
        if: needs.prepare.outputs.tag != ''
        run: node scripts/set-version.mjs --check "${{ needs.prepare.outputs.tag }}"

      - name: Build web UI and service
        run: pnpm build

      - name: Stage the service and Node.js
        run: node scripts/stage-desktop.mjs

      - name: Package the desktop app
        working-directory: apps/desktop
        # electron-builder downloads Electron and its helper tools from GitHub, which sometimes answers 504; the
        # downloads are cached, so another attempt picks up where the failed one stopped.
        run: |
          for attempt in 1 2 3; do
            pnpm exec electron-builder --${{ matrix.os }} --${{ matrix.arch }} --publish never && exit 0
            echo "::warning::electron-builder attempt $attempt failed"
            sleep $((attempt * 20))
          done
          exit 1

      - name: Smoke test the bundled service
        run: |
          resources="$(find apps/desktop/dist -type d \( -path '*.app/Contents/Resources' -o -path '*-unpacked/resources' \) | head -n1)"
          [ -n "$resources" ] || { echo "no unpacked app in apps/desktop/dist"; ls -R apps/desktop/dist | head -50; exit 1; }
          node_bin="$resources/node/node"; [ -f "$node_bin.exe" ] && node_bin="$node_bin.exe"
          tmp="$RUNNER_TEMP"; command -v cygpath >/dev/null && tmp="$(cygpath -m "$RUNNER_TEMP")"
          export SUPER_ASSISTANT_HOME="$tmp/home" SUPER_ASSISTANT_SECRETS=file
          "$node_bin" --version
          "$node_bin" "$resources/daemon/cli.mjs" start -d --desktop --port 7432
          token="$(cat "$SUPER_ASSISTANT_HOME/token")"
          curl -fsS -H "authorization: Bearer $token" http://127.0.0.1:7432/api/health
          # Browser access is off by default in the desktop app; its window is let in.
          test "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:7432/auth?token=$token")" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'x-super-assistant-client: desktop' "http://127.0.0.1:7432/auth?token=$token")" = 302
          "$node_bin" "$resources/daemon/cli.mjs" stop
          cat "$SUPER_ASSISTANT_HOME/logs/daemon.log"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-${{ matrix.arch }}
          path: |
            apps/desktop/dist/super-assistant-*.dmg
            apps/desktop/dist/super-assistant-*.zip
            apps/desktop/dist/super-assistant-*-setup.exe
          if-no-files-found: error

  publish:
    if: needs.prepare.outputs.tag != ''
    needs: [prepare, linux, desktop]
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # creates the tag and publishes the GitHub Release that install.sh and the update check read
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          SHA: ${{ needs.prepare.outputs.sha }}
          NOTES: ${{ inputs.notes }}
        run: |
          ls -l dist
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          elif [ -n "$NOTES" ]; then
            # A manual run: the tag does not exist yet, so the Release creates it on the built commit.
            gh release create "$TAG" dist/* --target "$SHA" --title "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" dist/* --target "$SHA" --title "$TAG" --generate-notes
          fi
