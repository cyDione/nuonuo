name: Package Linux x64

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - apps/desktop/**
      - .github/workflows/package-linux.yml

permissions:
  contents: read

jobs:
  linux-x64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build web UI and daemon
        run: pnpm build

      - name: Stage daemon dependencies
        run: pnpm --filter @super-assistant/desktop stage

      - name: Package AppImage and tar.gz
        working-directory: apps/desktop
        run: pnpm exec electron-builder --linux --x64

      - uses: actions/upload-artifact@v4
        with:
          name: super-assistant-linux-x64
          path: |
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.tar.gz
          if-no-files-found: error
