name: Package Linux x64

# Headless package: the service plus the web UI, with its own Node.js runtime (no desktop app).

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - scripts/stage-daemon.sh
      - scripts/package-linux.sh
      - install.sh
      - scripts/set-version.mjs
      - .github/workflows/package-linux.yml

permissions:
  contents: write  # only used on v* tags, to publish the GitHub Release that install.sh downloads from

jobs:
  linux-x64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        # Every package must be at the tag's version (pnpm set-version sets them all); the update check compares them.
        run: node scripts/set-version.mjs --check "$GITHUB_REF_NAME"

      - name: Build web UI and service
        run: pnpm build

      - name: Package
        run: bash scripts/package-linux.sh x64

      - name: Smoke test the package
        run: |
          mkdir -p "$RUNNER_TEMP/pkg"
          tar -xzf dist/super-assistant-*-linux-x64.tar.gz -C "$RUNNER_TEMP/pkg"
          bin="$(echo "$RUNNER_TEMP"/pkg/*/bin/super-assistant)"
          export SUPER_ASSISTANT_HOME="$RUNNER_TEMP/home"
          "$bin" start --no-open > "$RUNNER_TEMP/daemon.log" 2>&1 &
          for i in $(seq 1 30); do
            [ -f "$SUPER_ASSISTANT_HOME/token" ] && curl -fsS -H "authorization: Bearer $(cat "$SUPER_ASSISTANT_HOME/token")" http://127.0.0.1:7420/api/health && break
            sleep 1
          done
          curl -fsS -o /dev/null http://127.0.0.1:7420/
          kill %1
          cat "$RUNNER_TEMP/daemon.log"

      - uses: actions/upload-artifact@v4
        with:
          name: super-assistant-linux-x64
          path: dist/super-assistant-*-linux-x64.tar.gz
          if-no-files-found: error

      - name: Publish the GitHub Release (v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/super-assistant-*-linux-x64.tar.gz --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/super-assistant-*-linux-x64.tar.gz --title "$GITHUB_REF_NAME" --generate-notes
          fi
