<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0%25' stop-color='%23e32450'/><stop offset='100%25' stop-color='%23b9143c'/></linearGradient></defs><rect width='100' height='100' rx='24' fill='url(%23g)'/><path d='M28 74 C18 74 15 66 15 55 C15 39 27 30 50 30 C73 30 85 39 85 55 C85 66 82 74 72 74 Z' fill='%23ffffff'/><circle cx='46' cy='51' r='3.6' fill='%23c81742'/><circle cx='62' cy='51' r='3.6' fill='%23c81742'/></svg>" />
    <meta name="theme-color" content="#f7f3f0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1017" media="(prefers-color-scheme: dark)" />
    <script>
      try {
        const p = JSON.parse(localStorage.getItem('sa-prefs') || '{}')
        const t = ['light', 'dark', 'system'].includes(p.theme) ? p.theme : 'system'
        const root = document.documentElement
        if (t === 'system') delete root.dataset.theme
        else root.dataset.theme = t
        const isDark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        root.classList.toggle('dark', isDark)
        if (p.accent) root.dataset.accent = p.accent
      } catch {}
    </script>
    <title>Nuonuo</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
